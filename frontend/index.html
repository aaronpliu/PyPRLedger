<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>PR Ledger - Code Review Management System</title>
    <meta name="title" content="PR Ledger - Code Review Management System" />
    <meta name="description" content="Professional code review management system with scoring, analytics, and team collaboration features" />
    <meta name="keywords" content="code review, pull request, PR management, code quality, developer tools" />
    <meta name="author" content="PR Ledger Team" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prledger.example.com/" />
    <meta property="og:title" content="PR Ledger - Code Review Management System" />
    <meta property="og:description" content="Professional code review management system with scoring, analytics, and team collaboration features" />
    <meta property="og:image" content="https://prledger.example.com/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://prledger.example.com/" />
    <meta property="twitter:title" content="PR Ledger - Code Review Management System" />
    <meta property="twitter:description" content="Professional code review management system with scoring, analytics, and team collaboration features" />
    <meta property="twitter:image" content="https://prledger.example.com/twitter-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#409eff" />
    <meta name="msapplication-TileColor" content="#409eff" />

    <!-- The app mounts only after the auth handshake, so this stands in for it:
         a blank page during that wait told the reader nothing. -->
    <style>
      html,
      body {
        height: 100%;
      }
      #boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 100vh;
        color: #909399;
        font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', Arial, sans-serif;
        font-size: 14px;
      }
      #boot-loading .boot-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #dcdfe6;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    
    <!-- PWA -->
    <meta name="application-name" content="PR Ledger" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PR Ledger" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app">
      <div id="boot-loading" role="status" aria-live="polite">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span class="boot-text">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
