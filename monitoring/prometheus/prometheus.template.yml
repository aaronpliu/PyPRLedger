# Prometheus Configuration — PRLedger Monitoring
# Global defaults
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules once and periodically evaluate them
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # PRLedger API
  # Target placeholder is replaced by entrypoint.sh using the
  # PRLEDGER_SCRAPE_TARGET env var (set in .env or docker-compose).
  # Default: api:8000. Configure via .env as:
  #   PRLEDGER_SCRAPE_TARGET=api:9097
  - job_name: "PRLedger"
    static_configs:
      - targets:
          - "__PRLEDGER_SCRAPE_TARGET__"
    metrics_path: "/api/metrics"
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
    scrape_interval: 15s
    scrape_timeout: 10s
