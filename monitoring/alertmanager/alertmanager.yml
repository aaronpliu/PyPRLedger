# ───────────────────────────────────────────────────────────
# AlertManager Configuration — PRLedger Monitoring
# ───────────────────────────────────────────────────────────
# Slack receiver is optional. To enable, set these env vars:
#   SLACK_WEBHOOK_URL=https://hooks.slack.com/services/...
#   SLACK_CHANNEL=#monitoring-alerts
# ───────────────────────────────────────────────────────────

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Severity-based routing:
  #   critical → all receivers (console + slack)
  #   warning  → console + slack
  #   info     → console only
  routes:
    - match:
        severity: critical
      receiver: "default"
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

    - match:
        severity: info
      receiver: "console"
      repeat_interval: 8h

# ─── Receivers ───────────────────────────────────────────
receivers:
  # Default receiver: console + Slack (if configured)
  - name: "default"
    slack_configs:
      - channel: "${SLACK_CHANNEL}"
        api_url: "${SLACK_WEBHOOK_URL}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  # Console-only receiver (for info-severity alerts)
  - name: "console"
    webhook_configs:
      - url: "http://localhost:9093/"

# ─── Inhibition Rules ───────────────────────────────────
# Critical alerts suppress warning alerts of the same type
# to reduce noise during incidents.
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]

# ─── Templates (Slack message formatting) ───────────────
templates:
  - "/etc/alertmanager/templates/*.tmpl"
