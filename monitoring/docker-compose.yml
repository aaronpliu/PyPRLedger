# ─────────────────────────────────────────────────────────────
# PRLedger Monitoring Stack
# ─────────────────────────────────────────────────────────────
# Deploys Prometheus + Grafana + AlertManager as a standalone
# monitoring stack.
#
# Prerequisites:
#   1. Docker network (run once):
#        docker network create code-review-network
#   2. The main PRLedger stack must be running on the same
#      network so Prometheus can scrape api:8000/metrrics.
#
# Usage:
#   cp .env.example .env      # edit as needed
#   docker compose up -d      # start the stack
#   docker compose down       # stop the stack
# ─────────────────────────────────────────────────────────────

services:
  # ─── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prledger-prometheus
    ports:
      # Explicit 0.0.0.0 required for rootless Podman; Docker defaults to this.
      - "0.0.0.0:9090:9090"
    environment:
      - PROMETHEUS_RETENTION_TIME=${PROMETHEUS_RETENTION_TIME:-15d}
      - PROMETHEUS_RETENTION_SIZE=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - PRLEDGER_SCRAPE_TARGET=${PRLEDGER_SCRAPE_TARGET:-api:8000}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - code-review-network

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    # Using latest; pin to a specific version (e.g., grafana/grafana:11.5.2)
    # if the rolling latest has issues.
    image: grafana/grafana:latest
    container_name: prledger-grafana
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      # grafana-piechart-panel is deprecated and removed in Grafana 11+;
      # dashboards use built-in visualization types instead.
      # Remove this if you need the plugin, but prefer native chart types.
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # Check if Grafana's HTTP server is up by testing the API health endpoint.
      # Uses wget first (Alpine), falls back to curl (Ubuntu-based images).
      # The start_period gives Grafana time to initialize (~60s) before failures count.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health > /dev/null 2>&1 || curl -sf http://localhost:3000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # No explicit memory limit — Grafana 11.x with apiserver + 52 plugins
    # can spike past 512M at startup. Let it use what it needs.
    networks:
      - code-review-network

  # ─── AlertManager ──────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: prledger-alertmanager
    ports:
      - "0.0.0.0:9093:9093"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-#monitoring-alerts}
      - ALERTMANAGER_LOG_LEVEL=info
    volumes:
      # Entrypoint generates alertmanager.yml at runtime (conditionally adds Slack)
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      # Templates dir for Slack message formatting (only used when Slack enabled)
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      # Base config file (kept as reference — entrypoint generates the active config)
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.reference.yml:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - code-review-network

# ─── Persistent Volumes ────────────────────────────────────
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# ─── Network ────────────────────────────────────────────────
# This stack MUST be on the same Docker network as the main
# PRLedger app stack so Prometheus can scrape api:8000/metrics.
#
# Create this network before deploying:
#   docker network create code-review-network
#
# If you already ran the main PRLedger stack, the network
# should already exist. Verify with:
#   docker network ls | grep code-review-network
networks:
  code-review-network:
    external: true
