#.pre-commit-config.yaml

repos:
  # --------------------------------------------
  # Ruff: format + lint using locally installed ruff
  # --------------------------------------------
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        description: Format files with ruff
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^tests/data/  # optional: exclude test fixtures

      - id: ruff-check
        name: ruff-check
        description: Lint files with ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        exclude: ^tests/data/
        always_run: true

  # --------------------------------------------
  # Unit tests: run on every commit
  # --------------------------------------------
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend unit tests
        description: Run the full backend pytest suite
        entry: uv run pytest
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        verbose: true

      - id: frontend-tests
        name: Frontend unit tests
        description: Run the full frontend Vitest suite
        entry: bash -c "cd frontend && npm run test:run"
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        verbose: true

  # --------------------------------------------
  # Simple commit message validation (local script)
  # --------------------------------------------
  - repo: local
    hooks:
      - id: commit-message-validation
        name: Validate commit message
        description: Enforce basic commit message rules
        entry: python3 scripts/validate_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true